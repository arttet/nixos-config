[tools]
"npm:cspell" = "10.0.1"
"npm:markdownlint-cli2" = "0.23.1"
"npm:wrangler" = "4.114.0"

act = "0.2.89"
actionlint = "1.7.12"
bun = "1.3.14"
dprint = "0.55.2"
editorconfig-checker = "3.8.0"
just = "1.57.0"
lychee = "0.24.2"
semgrep = "1.171.0"
trivy = "0.72.0"
trufflehog = "3.96.0"
uv = "0.11.32"
yamllint = "1.38.0"
zizmor = "1.28.0"

[settings]
all_compile = false

[env]
MSYS_NO_PATHCONV = "1"
CLAMAV_DB_DIR = "{{config_root}}/.tools/clamav-db"
CLAMAV_IMAGE = "clamav/clamav:1.5.3_base"
SEMGREP_IMAGE = "semgrep/semgrep:1.169.0"
CF_DOCS_PAGES_PROJECT = "nixos-config-docs"
CACHIX_CACHE_NAME = "homelab-rpi5"
npm_config_fetch_retries = "5"
npm_config_fetch_retry_mintimeout = "20000"
npm_config_fetch_retry_maxtimeout = "120000"
npm_config_fetch_timeout = "300000"

# ==============================================================================
# Development Gate
# ==============================================================================

[tasks."deps:outdated"]
description = "Show available dependency updates with Renovate local report"
shell = "bash -c"
run = """
RENOVATE_GITHUB_COM_TOKEN="$(gh auth token)" mise exec node@24 -- npx --yes renovate@43.272.6 \
  --platform=local \
  --onboarding=false \
  --require-config=required \
  --report-type=logging \
  --cache-dir=.tools/renovate/cache
"""

[tasks.check]
description = "Run all checks"
depends = ["fmt:all", "lint:all", "security:all", "antivirus:all", "docs:all"]

[tasks.ci]
description = "Run GitHub Actions locally with act"
shell = "bash -c"
run = """
act pull_request --bind --artifact-server-path .tools/act-artifacts \
  -s GITHUB_TOKEN="$(gh auth token)" \
  -P ubuntu-26.04=catthehacker/ubuntu:act-latest
"""

[tasks."ci:list"]
description = "List GitHub Actions jobs available via act"
run = "act --list"

# ==============================================================================
# Stage 1: Format Quality Gate
# ==============================================================================

[tasks."fmt:just"]
description = "Justfile format check"
run = "just --fmt --check"

[tasks."fmt:editorconfig"]
description = "EditorConfig check"
run = "ec"

[tasks."fmt:dprint"]
description = "Source format check"
run = "dprint check"

[tasks."fmt:all"]
description = "All format checks"
depends = ["fmt:just", "fmt:editorconfig", "fmt:dprint"]

# ==============================================================================
# Stage 1: Lint Quality Gate
# ==============================================================================

[tasks."lint:actions"]
description = "GitHub Workflow lint"
run = "actionlint"

[tasks."lint:yaml"]
description = "YAML lint"
run = "yamllint ."

[tasks."lint:zizmor"]
description = "GitHub Actions security audit"
run = "zizmor --persona pedantic .github/workflows/"

[tasks."lint:cspell"]
description = "Spell check"
run = "cspell --no-progress"

[tasks."lint:markdown"]
description = "Markdown lint"
run = "markdownlint-cli2 **/*.md"

[tasks."lint:all"]
description = "All lint checks"
depends = [
  "lint:actions",
  "lint:yaml",
  "lint:zizmor",
  "lint:cspell",
  "lint:markdown",
]

# ==============================================================================
# Stage 1: Security Quality Gate
# ==============================================================================

[tasks."security:secrets"]
description = "Secret scanning over git history"
run = "trufflehog git file://. --results=verified,unknown --fail"

[tasks."security:semgrep"]
description = "SAST scan (OSS rules)"
shell = "bash -c"
run = """
semgrep scan --verbose --config p/ci --oss-only --metrics=off --error --exclude .tools
"""

[tasks."security:trivy"]
description = "Trivy scan"
shell = "bash -c"
run = """
mkdir -p .tools/docker .tools/trivy
export DOCKER_CONFIG="$PWD/.tools/docker"
trivy fs \
  --scanners vuln,secret,misconfig \
  --include-dev-deps \
  --format json \
  --output .tools/trivy/trivy.json \
  --exit-code 0 \
  --timeout 10m \
  .
"""

[tasks."security:trivy:table"]
description = "Convert Trivy report to table"
run = """
trivy convert \
  --scanners vuln,secret,misconfig \
  --format table \
  .tools/trivy/trivy.json
"""
depends = ["security:trivy"]

[tasks."security:trivy:sarif"]
description = "Convert Trivy report to SARIF"
run = """
trivy convert \
  --scanners vuln,secret,misconfig \
  --format sarif \
  --output .tools/trivy/trivy-results.sarif \
  .tools/trivy/trivy.json
"""
depends = ["security:trivy"]

[tasks."security:all"]
description = "All security checks"
depends = [
  "security:secrets",
  "security:semgrep",
  "security:trivy:table",
  "security:trivy:sarif",
]

# ==============================================================================
# Antivirus Gate
# ==============================================================================

[tasks."antivirus:update"]
description = "Update ClamAV database into CLAMAV_DB_DIR"
shell = "bash -c"
run = """
mkdir -p "$CLAMAV_DB_DIR"
docker run --rm -v "$CLAMAV_DB_DIR:/var/lib/clamav" "$CLAMAV_IMAGE" \
  freshclam --foreground --debug
"""

[tasks."antivirus:scan"]
description = "Malware scan of the working tree (CI/Linux; on Windows see MSYS notes)"
shell = "bash -c"
run = """
docker run --rm \
  --entrypoint clamscan \
  -v "$PWD:/scandir:ro" \
  -v "$CLAMAV_DB_DIR:/var/lib/clamav:ro" \
  "$CLAMAV_IMAGE" \
  --recursive \
  --infected \
  --exclude-dir='^/scandir/\\.git' \
  --exclude-dir='^/scandir/\\.tools/clamav-db' \
  /scandir
"""

[tasks."antivirus:all"]
description = "All antivirus checks"
run = ["mise run antivirus:update", "mise run antivirus:scan"]

# ==============================================================================
# Stage 1: Documentation Gate
# ==============================================================================

[tasks."docs:install"]
description = "Install dependencies"
dir = "docs"
run = "bun install --frozen-lockfile"

[tasks."docs:audit"]
description = "Audit docs dependencies"
dir = "docs"
run = "bun audit"
depends = ["docs:install"]

[tasks."docs:build"]
description = "Build VitePress docs"
dir = "docs"
run = "bun run docs:build"
depends = ["docs:install"]

[tasks."docs:links"]
description = "Link check over built docs"
run = 'lychee --config lychee.toml --root-dir "{{config_root}}/docs/.vitepress/dist" docs/.vitepress/dist'

[tasks."docs:all"]
description = "All documentation checks"
depends = ["docs:audit", "docs:build", "docs:links"]

[tasks."docs:deploy:cloudflare"]
description = "Deploy built docs to Cloudflare Pages (requires CLOUDFLARE_API_TOKEN)"
dir = "docs"
shell = "bash -c"
run = """
: "${CF_DOCS_PAGES_PROJECT:?CF_DOCS_PAGES_PROJECT is required}"
if [ -n "${CF_DOCS_BRANCH:-}" ]; then
  wrangler pages deploy .vitepress/dist --project-name "${CF_DOCS_PAGES_PROJECT}" --branch "${CF_DOCS_BRANCH}"
else
  wrangler pages deploy .vitepress/dist --project-name "${CF_DOCS_PAGES_PROJECT}"
fi
"""
