name: Nightly

on:
  schedule:
    - cron: "0 3 * * *" # Daily at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read # Default read-only for all jobs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    outputs:
      deploy: ${{ steps.preflight.outputs.deploy }}
      dotfiles_repo: ${{ steps.preflight.outputs.dotfiles_repo }}
      dotfiles_ref: ${{ steps.preflight.outputs.dotfiles_ref }}
      dotfiles_module: ${{ steps.preflight.outputs.dotfiles_module }}
      dotfiles_root: ${{ steps.preflight.outputs.dotfiles_root }}
      dotfiles_links: ${{ steps.preflight.outputs.dotfiles_links }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            cache.nixos.org:443
            channels.nixos.org:443
            github.com:443
            nixos-raspberrypi.cachix.org:443
            release-assets.githubusercontent.com:443
            releases.nixos.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            download-attempts = 5
            connect-timeout = 60
            stalled-download-timeout = 300
            accept-flake-config = true
            cores = 0

      - name: Validate nightly inputs
        id: preflight
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          NIGHTLY_DOTFILES_REPO: ${{ vars.NIGHTLY_DOTFILES_REPO }}
          NIGHTLY_DOTFILES_REF: ${{ vars.NIGHTLY_DOTFILES_REF || 'main' }}
          NIGHTLY_DOTFILES_MODULE: ${{ vars.NIGHTLY_DOTFILES_MODULE }}
          NIGHTLY_DOTFILES_ROOT: ${{ vars.NIGHTLY_DOTFILES_ROOT }}
          NIGHTLY_DOTFILES_LINKS: ${{ vars.NIGHTLY_DOTFILES_LINKS }}
        run: nix shell --inputs-from . nixpkgs#nushell -c nu scripts/ci/nightly-preflight.nu

  # ==============================================================================
  # Desktop
  # ==============================================================================

  desktop:
    name: Desktop Nightly
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs: preflight

    env:
      DPRINT_CACHE_DIR: ${{ github.workspace }}/.tools/dprint

    outputs:
      lock_changed: ${{ steps.lock.outputs.changed }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            *.archive.ubuntu.com:80
            api.github.com:443
            cache.nixos.org:443
            cdn.zoom.us:443
            channels.nixos.org:443
            developer.download.nvidia.com:443
            dl.google.com:443
            esm.ubuntu.com:443
            files.pythonhosted.org:443
            github.com:443
            launchpad.net:443
            launchpadlibrarian.net:443
            mise-versions.jdx.dev:443
            nixos-raspberrypi.cachix.org:443
            nodejs.org:443
            obsidian.md:443
            packages.microsoft.com:443
            pkg.cloudflareclient.com:443
            plugins.dprint.dev:443
            pypi.org:443
            raw.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            releases.nixos.org:443
            repo.yandex.ru:443
            static.crates.io:443
            tarballs.nixos.org:443
            tuf-repo-cdn.sigstore.dev:443
            update.code.visualstudio.com:443
            vscode.download.prss.microsoft.com:443
            zoom.us:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore dprint cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ env.DPRINT_CACHE_DIR }}
          key: dprint-${{ runner.os }}-${{ hashFiles('dprint.json') }}

      - name: Install mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.11.2
          reshim: true

      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@8b8cd4e2277836962939a8f3b4ea0ee4bc006156 # v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_packages: >-
            azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable
            firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*
          remove_packages_one_command: true
          remove_folders: >-
            /usr/share/swift /usr/share/miniconda /usr/share/az*
            /usr/local/lib/node_modules /usr/local/share/chromium
            /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli
            /usr/local/aws-sam-cli /usr/share/gradle
          rm_cmd: "rmz"
          rmz_version: "3.2.0"

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            download-attempts = 5
            connect-timeout = 60
            stalled-download-timeout = 300
            accept-flake-config = true
            cores = 0

      - name: Update flake lock
        run: nix flake update

      - name: Checkout dotfiles
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.preflight.outputs.dotfiles_repo }}
          ref: ${{ needs.preflight.outputs.dotfiles_ref }}
          path: target/ci/dotfiles
          persist-credentials: false

      - name: Prepare platform state
        id: prepare
        env:
          NIGHTLY_DOTFILES_MODULE: ${{ needs.preflight.outputs.dotfiles_module }}
          NIGHTLY_DOTFILES_ROOT: ${{ needs.preflight.outputs.dotfiles_root }}
          NIGHTLY_DOTFILES_LINKS: ${{ needs.preflight.outputs.dotfiles_links }}
        run: nix shell --inputs-from . nixpkgs#nushell nixpkgs#mkpasswd nixpkgs#jsonschema-cli -c nu scripts/ci/nightly-prepare.nu

      - name: Validate nightly platform state
        env:
          STATE_FILE: ${{ steps.prepare.outputs.state }}
        run: >
          nix shell --inputs-from . nixpkgs#jsonschema-cli
          -c jsonschema-cli validate schemas/platform-state.v1.schema.json -i "$STATE_FILE"

      - name: Validate desktop
        env:
          NIX_CONFIG_LOCAL_STATE: ${{ steps.prepare.outputs.state }}
        run: just desktop test

      - name: Capture lockfile diff
        id: lock
        if: ${{ always() }}
        run: |
          mkdir -p target/ci/update
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Flake lock"
              echo "No flake.lock changes."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            cp flake.lock target/ci/update/flake.lock
            git diff -- flake.lock > target/ci/update/flake-lock.diff
            {
              echo "## Flake lock"
              echo "flake.lock changed after nix flake update."
              echo ""
              echo '```diff'
              sed -n '1,240p' target/ci/update/flake-lock.diff
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload lockfile update
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ steps.lock.outputs.changed == 'true' }}
        with:
          name: nightly-flake-update
          path: target/ci/update/

  # ==============================================================================
  # Homelab Raspberry Pi 5
  # ==============================================================================

  homelab:
    name: Homelab PI 5
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 360

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            *.archive.ubuntu.com:80
            api.github.com:443
            cache.nixos.org:443
            cachix.org:443
            channels.nixos.org:443
            dl.google.com:443
            esm.ubuntu.com:443
            github.com:443
            homelab-rpi5.cachix.org:443
            nixos-raspberrypi.cachix.org:443
            packages.microsoft.com:443
            release-assets.githubusercontent.com:443
            releases.nixos.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@8b8cd4e2277836962939a8f3b4ea0ee4bc006156 # v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_packages: >-
            azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable
            firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*
          remove_packages_one_command: true
          remove_folders: >-
            /usr/share/swift /usr/share/miniconda /usr/share/az*
            /usr/local/lib/node_modules /usr/local/share/chromium
            /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli
            /usr/local/aws-sam-cli /usr/share/gradle
          rm_cmd: "rmz"
          rmz_version: "3.2.0"

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            download-attempts = 5
            connect-timeout = 60
            stalled-download-timeout = 300
            accept-flake-config = true
            cores = 0

      - name: Set up Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: homelab-rpi5
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}

      - name: Build Homelab Pi 5
        run: nix build --no-link .#nixosConfigurations.homelab-rpi5.config.system.build.toplevel

  # ==============================================================================
  # Homelab Raspberry Pi 5 SD Image
  # ==============================================================================

  homelab-image:
    name: Homelab PI 5 SD Image
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 360
    needs: [homelab]

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            *.archive.ubuntu.com:80
            api.github.com:443
            cache.nixos.org:443
            cachix.org:443
            channels.nixos.org:443
            dl.google.com:443
            esm.ubuntu.com:443
            github.com:443
            homelab-rpi5.cachix.org:443
            nixos-raspberrypi.cachix.org:443
            packages.microsoft.com:443
            release-assets.githubusercontent.com:443
            releases.nixos.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@8b8cd4e2277836962939a8f3b4ea0ee4bc006156 # v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_packages: >-
            azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable
            firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*
          remove_packages_one_command: true
          remove_folders: >-
            /usr/share/swift /usr/share/miniconda /usr/share/az*
            /usr/local/lib/node_modules /usr/local/share/chromium
            /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli
            /usr/local/aws-sam-cli /usr/share/gradle
          rm_cmd: "rmz"
          rmz_version: "3.2.0"

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            download-attempts = 5
            connect-timeout = 60
            stalled-download-timeout = 300
            accept-flake-config = true
            cores = 0

      - name: Set up Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: homelab-rpi5
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}

      - name: Build Homelab Pi 5 SD image
        run: |
          nix build .#nixosConfigurations.homelab-rpi5.config.system.build.sdImage \
            --out-link target/homelab-rpi5-image
          mkdir -p target/artifacts
          cp target/homelab-rpi5-image/sd-image/*.img.zst target/artifacts/
          ls -lh target/artifacts/

      # The image is already zstd-compressed, so skip artifact recompression.
      - name: Upload SD image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: homelab-rpi5-sdimage
          path: target/artifacts/*.img.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

