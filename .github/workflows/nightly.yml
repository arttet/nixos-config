            /usr/local/aws-sam-cli /usr/share/gradle
          rm_cmd: "rmz"
          rmz_version: "3.2.0"

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            download-attempts = 5
            connect-timeout = 60
            stalled-download-timeout = 300
            accept-flake-config = true
            cores = 0

      - name: Set up Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: homelab-rpi5
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}

      - name: Build Workstation aarch64
        run: nix build --no-link .#nixosConfigurations.workstation-aarch64.config.system.build.toplevel
