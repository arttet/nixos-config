# Link checker config (https://lychee.cli.rs/usage/config)

max_retries = 3
retry_wait_time = 3
max_concurrency = 8
timeout = 5
cache = true
max_cache_age = "1d"
verbose = "info"

# Treat rate-limiting and partial content as success.
accept = [200, 204, 206, 429]

exclude_loopback = true
exclude_private = true
include_mail = false

exclude = [
  "^mailto:",
  "localhost",
  "127.0.0.1",
  "0.0.0.0",
  "gnu.org",
]

exclude_path = ["[.]md$"]
fallback_extensions = ["html"]
index_files = ["index.html"]
no_progress = true
offline = true
